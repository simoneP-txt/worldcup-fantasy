[project]
name = "wcfantasy"
version = "0.1.0"
description = "FIFA Fantasy World Cup 2026 advisor"
requires-python = ">=3.11"
# Runtime dependencies (mirrored in requirements.txt for the documented
# `pip install -e . -r requirements.txt` workflow). soccerdata is the
# optional club-stats prior: everything degrades to the price heuristic
# without it, so it lives in the `club` extra.
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pulp>=2.8",
    "rich>=13.7",
    # Local web GUI (`python -m wcfantasy serve`); no Node/npm build step.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
club = ["soccerdata>=1.8"]
# httpx backs fastapi.testclient.TestClient used by the API tests.
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the static single-page app (served by `serve`) inside the package.
[tool.setuptools.package-data]
wcfantasy = ["web/*.html", "web/assets/*"]
